<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Transfert P2P</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 80px; margin: .3rem 0 1rem; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  button { padding: .5rem 1rem; margin: .2rem 0; cursor: pointer; }
  progress { width: 100%; }
</style>
</head>
<body>
  <h2>1. Côté envoyeur</h2>
  <button id="creer">Créer l'offre</button>
  <p>Ton code à copier (offre) :</p>
  <textarea id="monCode" readonly></textarea>
  <p>Code de l'autre personne (réponse) :</p>
  <textarea id="codeReponse"></textarea>
  <button id="connecter">Se connecter</button>

  <h2>2. Côté receveur</h2>
  <p>Code de l'envoyeur (offre) :</p>
  <textarea id="codeOffre"></textarea>
  <button id="repondre">Générer la réponse</button>
  <p>Ta réponse à renvoyer :</p>
  <textarea id="maReponse" readonly></textarea>

  <h2>3. Transfert</h2>
  <input type="file" id="fichier">
  <button id="envoyer">Envoyer</button>
  <progress id="progression" value="0" max="100"></progress>
  <p id="statut"></p>
  <a id="telecharger"></a>

<script>
const CHUNK = 16 * 1024;
const $ = id => document.getElementById(id);
const statut = t => $('statut').textContent = t;

let pc = null;
let canal = null;
let meta = null, morceaux = [], recu = 0;

function nouvelleConnexion() {
  pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });
  pc.onconnectionstatechange = () => statut('Connexion : ' + pc.connectionState);
  pc.ondatachannel = e => brancherCanal(e.channel);
  return pc;
}

// Attend la fin de la collecte ICE, avec un délai de sécurité
function attendreIce() {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const verifier = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', verifier);
        res();
      }
    };
    pc.addEventListener('icegatheringstatechange', verifier);
    setTimeout(res, 5000); // on continue quoi qu'il arrive après 5 s
  });
}

function brancherCanal(c) {
  canal = c;
  canal.binaryType = 'arraybuffer';
  canal.onopen = () => statut('Connecté ✅');
  canal.onclose = () => statut('Canal fermé');
  canal.onmessage = e => recevoir(e.data);
}

function encoder(desc) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(desc))));
}
function decoder(texte) {
  return JSON.parse(decodeURIComponent(escape(atob(texte.trim()))));
}

// Envoyeur : créer l'offre
$('creer').onclick = async () => {
  try {
    nouvelleConnexion();
    brancherCanal(pc.createDataChannel('fichier'));
    statut('Création de l\'offre...');
    await pc.setLocalDescription(await pc.createOffer());
    await attendreIce();
    $('monCode').value = encoder(pc.localDescription);
    statut('Offre prête, copie-la et envoie-la à l\'autre personne.');
  } catch (err) {
    statut('Erreur : ' + err.message);
  }
};

// Envoyeur : appliquer la réponse
$('connecter').onclick = async () => {
  try {
    await pc.setRemoteDescription(decoder($('codeReponse').value));
    statut('Réponse appliquée, connexion en cours...');
  } catch (err) {
    statut('Erreur : ' + err.message);
  }
};

// Receveur : générer la réponse à partir de l'offre
$('repondre').onclick = async () => {
  try {
    nouvelleConnexion();
    await pc.setRemoteDescription(decoder($('codeOffre').value));
    await pc.setLocalDescription(await pc.createAnswer());
    await attendreIce();
    $('maReponse').value = encoder(pc.localDescription);
    statut('Réponse prête, renvoie-la à l\'envoyeur.');
  } catch (err) {
    statut('Erreur : ' + err.message);
  }
};

// Envoi du fichier
$('envoyer').onclick = async () => {
  const f = $('fichier').files[0];
  if (!f || !canal || canal.readyState !== 'open') return statut('Pas connecté ou pas de fichier');

  canal.send(JSON.stringify({ name: f.name, size: f.size, type: f.type }));

  for (let off = 0; off < f.size; off += CHUNK) {
    const buf = await f.slice(off, off + CHUNK).arrayBuffer();
    while (canal.bufferedAmount > 4 * 1024 * 1024) {
      await new Promise(r => setTimeout(r, 20));
    }
    canal.send(buf);
    $('progression').value = (off / f.size) * 100;
  }
  canal.send('EOF');
  $('progression').value = 100;
  statut('Envoi terminé ✅');
};

// Réception
function recevoir(d) {
  if (typeof d === 'string') {
    if (d === 'EOF') {
      const blob = new Blob(morceaux, { type: meta.type });
      const lien = $('telecharger');
      lien.href = URL.createObjectURL(blob);
      lien.download = meta.name;
      lien.textContent = `Télécharger ${meta.name}`;
      statut('Fichier reçu ✅');
      morceaux = []; recu = 0; meta = null;
    } else {
      meta = JSON.parse(d);
      statut(`Réception de ${meta.name}...`);
    }
    return;
  }
  morceaux.push(d);
  recu += d.byteLength;
  $('progression').value = (recu / meta.size) * 100;
}
</script>
</body>
</html>
