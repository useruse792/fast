<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Transfert P2P</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  input, button { font-size: 1rem; padding: .5rem .8rem; margin: .3rem 0; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  progress { width: 100%; margin-top: 1rem; }
  #statut { min-height: 1.5em; margin-top: .5rem; }
</style>
</head>
<body>
  <h2>Transfert de fichier</h2>
  <label>Code du salon (le même pour les deux) :</label>
  <input type="text" id="salon" placeholder="ex : chat-42-bleu">
  <div>
    <button id="envoyeur">J'envoie</button>
    <button id="receveur">Je reçois</button>
  </div>
  <div id="zoneEnvoi" style="display:none">
    <input type="file" id="fichier">
    <button id="envoyer">Envoyer le fichier</button>
  </div>
  <progress id="progression" value="0" max="100"></progress>
  <p id="statut"></p>
  <a id="telecharger"></a>

<script>
// ====== À REMPLIR ======
const SUPABASE_URL = 'https://svlrekoorzxmvhoexwjx.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_nHpfwFCYGkxKXwlZMEJgYA_7uu8gXIr';
// =======================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CHUNK = 16 * 1024;
const $ = id => document.getElementById(id);
const statut = t => $('statut').textContent = t;

let pc, canal, salon, role;
let meta = null, morceaux = [], recu = 0;
const attente = [];

const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// Écoute les messages de signalisation de l'autre côté
function ecouterSignaux(monRole) {
  const autre = monRole === 'envoyeur' ? 'receveur' : 'envoyeur';
  sb.channel('sig-' + salon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'signaux', filter: `salon=eq.${salon}` },
      async payload => {
        const ligne = payload.new;
        if (!ligne || ligne.role !== autre || !ligne.contenu) return;
        const desc = JSON.parse(ligne.contenu);
        if (desc.type === 'offer' && monRole === 'receveur') {
          await pc.setRemoteDescription(desc);
          await pc.setLocalDescription(await pc.createAnswer());
          await attendreIce();
          await publier('receveur', pc.localDescription);
        } else if (desc.type === 'answer' && monRole === 'envoyeur') {
          await pc.setRemoteDescription(desc);
        }
      })
    .subscribe();
}

async function publier(monRole, desc) {
  await sb.from('signaux').upsert({ salon, role: monRole, contenu: JSON.stringify(desc) });
}

function attendreIce() {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const v = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', v); res(); } };
    pc.addEventListener('icegatheringstatechange', v);
    setTimeout(res, 5000);
  });
}

function nouvellePC() {
  pc = new RTCPeerConnection(config);
  pc.onconnectionstatechange = () => statut('Connexion : ' + pc.connectionState);
  pc.ondatachannel = e => brancherCanal(e.channel);
}

function brancherCanal(c) {
  canal = c;
  canal.binaryType = 'arraybuffer';
  canal.onopen = () => statut('Connecté ✅');
  canal.onmessage = e => recevoir(e.data);
}

function lireSalon() {
  salon = $('salon').value.trim();
  if (!salon) { statut('Entre un code de salon.'); return false; }
  return true;
}

// Envoyeur : crée l'offre et la publie
$('envoyeur').onclick = async () => {
  if (!lireSalon()) return;
  role = 'envoyeur';
  nouvellePC();
  brancherCanal(pc.createDataChannel('fichier'));
  ecouterSignaux('envoyeur');
  await pc.setLocalDescription(await pc.createOffer());
  await attendreIce();
  await publier('envoyeur', pc.localDescription);
  $('zoneEnvoi').style.display = 'block';
  statut('En attente du receveur...');
};

// Receveur : écoute l'offre et répond automatiquement
$('receveur').onclick = () => {
  if (!lireSalon()) return;
  role = 'receveur';
  nouvellePC();
  ecouterSignaux('receveur');
  statut('En attente de l\'envoyeur...');
};

// Envoi du fichier
$('envoyer').onclick = async () => {
  const f = $('fichier').files[0];
  if (!f || !canal || canal.readyState !== 'open') return statut('Pas encore connecté ou pas de fichier');
  canal.send(JSON.stringify({ name: f.name, size: f.size, type: f.type }));
  for (let off = 0; off < f.size; off += CHUNK) {
    const buf = await f.slice(off, off + CHUNK).arrayBuffer();
    while (canal.bufferedAmount > 4 * 1024 * 1024) await new Promise(r => setTimeout(r, 20));
    canal.send(buf);
    $('progression').value = (off / f.size) * 100;
  }
  canal.send('EOF');
  $('progression').value = 100;
  statut('Envoi terminé ✅');
};

function recevoir(d) {
  if (typeof d === 'string') {
    if (d === 'EOF') {
      const lien = $('telecharger');
      lien.href = URL.createObjectURL(new Blob(morceaux, { type: meta.type }));
      lien.download = meta.name;
      lien.textContent = `Télécharger ${meta.name}`;
      statut('Fichier reçu ✅');
      morceaux = []; recu = 0; meta = null;
    } else {
      meta = JSON.parse(d);
      statut(`Réception de ${meta.name}...`);
    }
    return;
  }
  morceaux.push(d);
  recu += d.byteLength;
  $('progression').value = (recu / meta.size) * 100;
}
</script>
</body>
</html>
