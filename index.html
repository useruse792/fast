<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Transfert temporaire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  input, button { font-size: 1rem; padding: .5rem .8rem; margin: .3rem 0; }
  button { cursor: pointer; }
  #statut { min-height: 1.5em; margin-top: .5rem; }
  #lien a { word-break: break-all; }
</style>
</head>
<body>
  <h2>Envoi de fichier</h2>
  <input type="file" id="fichier">
  <button id="envoyer">Envoyer</button>
  <p id="statut"></p>
  <div id="lien"></div>

<script>
// ====== À REMPLIR ======
const SUPABASE_URL = 'https://svlrekoorzxmvhoexwjx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nHpfwFCYGkxKXwlZMEJgYA_7uu8gXIr';
const BUCKET = 'transferts';
// =======================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const statut = t => $('statut').textContent = t;

$('envoyer').onclick = async () => {
  const f = $('fichier').files[0];
  if (!f) return statut('Choisis un fichier.');

  try {
    // Nom unique pour éviter les collisions
    const chemin = `${Date.now()}-${f.name.replace(/[^\w.-]/g, '_')}`;
    statut('Envoi en cours...');

    const { error } = await sb.storage.from(BUCKET).upload(chemin, f);
    if (error) throw error;

    const { data } = sb.storage.from(BUCKET).getPublicUrl(chemin);
    $('lien').innerHTML = `<p>Lien à envoyer :</p><a href="${data.publicUrl}" target="_blank">${data.publicUrl}</a>`;
    statut('Fichier envoyé ✅');
  } catch (e) {
    statut('Erreur : ' + e.message);
  }
};
</script>
</body>
</html>
